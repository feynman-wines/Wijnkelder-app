<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a0e17" />
      <stop offset="50%" stop-color="#2a060e" />
      <stop offset="100%" stop-color="#140206" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="wineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Subtle Gold Inner Border -->
  <rect x="18" y="18" width="476" height="476" rx="98" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.6" />

  <!-- Safe Zone Elements Container (within central 80%) -->
  <g transform="translate(0, 0)">
    <!-- Ambient Glow behind bottle and glass -->
    <circle cx="256" cy="256" r="130" fill="#be123c" opacity="0.25" filter="url(#glow)" />

    <!-- Wine Cellar Arch Outline (Minimalist) -->
    <path d="M 136 390 V 240 A 120 120 0 0 1 376 240 V 390" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="6,6" opacity="0.3" />

    <!-- Wine Bottle Silhouette (Left/Center) -->
    <g transform="translate(160, 110)">
      <!-- Capsule / Neck Gold Foil -->
      <path d="M 28 0 L 48 0 L 48 35 L 28 35 Z" fill="url(#goldGrad)" rx="3" />
      <!-- Bottle Neck -->
      <path d="M 29 35 L 47 35 L 50 85 L 26 85 Z" fill="#1c050a" />
      <!-- Bottle Body -->
      <path d="M 26 85 C 10 110 0 135 0 165 L 0 270 C 0 278 6 284 14 284 L 62 284 C 70 284 76 278 76 270 L 76 165 C 76 135 66 110 50 85 Z" fill="#2d060f" stroke="#fbbf24" stroke-width="2" stroke-opacity="0.4" />
      <!-- Bottle Label (Gold bordered) -->
      <rect x="12" y="145" width="52" height="85" rx="6" fill="#170307" stroke="url(#goldGrad)" stroke-width="1.5" />
      <!-- Minimal Label Stripes & Year -->
      <path d="M 22 165 H 54 M 26 175 H 50 M 30 185 H 46" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.8" />
      <circle cx="38" cy="208" r="4" fill="#fbbf24" opacity="0.9" />
    </g>

    <!-- Wine Glass with Liquid (Right/Center, overlapping bottle) -->
    <g transform="translate(250, 140)">
      <!-- Glass Bowl Silhouette Back -->
      <path d="M 15 35 C 15 125 115 125 115 35 Z" fill="url(#glassGrad)" stroke="#ffffff" stroke-width="3" stroke-opacity="0.5" />

      <!-- Glowing Wine Liquid Inside Glass -->
      <path d="M 22 65 C 22 115 108 115 108 65 C 85 75 45 55 22 65 Z" fill="url(#wineGrad)" />
      <!-- Wine meniscus highlight -->
      <path d="M 25 65 Q 65 78 105 65" fill="none" stroke="#f43f5e" stroke-width="2" opacity="0.8" />

      <!-- Glass Stem -->
      <rect x="62" y="125" width="6" height="110" rx="3" fill="#ffffff" fill-opacity="0.6" />

      <!-- Glass Base -->
      <ellipse cx="65" cy="235" rx="42" ry="7" fill="url(#glassGrad)" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.5" />

      <!-- Glass Highlight Gleam -->
      <path d="M 26 45 C 24 75 35 100 50 112" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.6" />
    </g>

    <!-- Star Sparkle 1 (Top Right) -->
    <g transform="translate(365, 115)">
      <path d="M 0 -18 Q 0 0 18 0 Q 0 0 0 18 Q 0 0 -18 0 Q 0 0 0 -18 Z" fill="url(#goldGrad)" filter="url(#glow)" />
      <circle cx="0" cy="0" r="3" fill="#ffffff" />
    </g>

    <!-- Star Sparkle 2 (Bottom Left) -->
    <g transform="translate(130, 320)">
      <path d="M 0 -10 Q 0 0 10 0 Q 0 0 0 10 Q 0 0 -10 0 Q 0 0 0 -10 Z" fill="url(#goldGrad)" opacity="0.8" />
    </g>

    <!-- App Title Typography / Monogram Badge at Bottom -->
    <g transform="translate(256, 435)">
      <rect x="-105" y="-18" width="210" height="34" rx="17" fill="#120204" stroke="url(#goldGrad)" stroke-width="1.5" />
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" letter-spacing="3" fill="#fbbf24" text-anchor="middle">WIJNKELDER</text>
    </g>
  </g>
</svg>
